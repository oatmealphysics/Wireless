<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone Scanner</title>
<style>
:root {
  --bg: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --border: #1e293b;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.15);
  --green: #22c55e;
  --yellow: #eab308;
  --orange: #f97316;
  --red: #ef4444;
  --purple: #a855f7;
  --cyan: #06b6d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}

.header h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 1px;
}

.header-status {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--text-dim);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
}

.status-dot.idle { background: var(--text-dim); }
.status-dot.scanning { background: var(--yellow); animation: pulse 1s infinite; }
.status-dot.done { background: var(--green); }
.status-dot.error { background: var(--red); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
}

.btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-card);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn:hover { background: var(--bg-card-hover); border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.btn-primary:hover { background: #2563eb; }

.btn-danger {
  border-color: var(--red);
  color: var(--red);
}

.btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

.btn-warning {
  border-color: var(--yellow);
  color: var(--yellow);
}

.btn-warning:hover { background: rgba(234, 179, 8, 0.1); }

.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
}

.main {
  display: flex;
  height: calc(100vh - 105px);
}

.target-list {
  width: 420px;
  min-width: 320px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
}

.target-list-header {
  padding: 12px 16px;
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 1;
}

.target-item {
  display: block;
  width: 100%;
  padding: 12px 16px;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background 0.1s;
}

.target-item:hover { background: var(--bg-card-hover); }
.target-item.selected { background: var(--accent-glow); border-left: 3px solid var(--accent); }
.target-item:focus-visible, .action-card:focus-visible, .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.target-item-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}

.target-name {
  font-size: 14px;
  font-weight: 500;
}

.target-protocol {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}

.proto-wifi { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }
.proto-mavlink { background: rgba(168, 85, 247, 0.15); color: var(--purple); }
.proto-elrs { background: rgba(34, 197, 94, 0.15); color: var(--green); }
.proto-ble { background: rgba(59, 130, 246, 0.15); color: var(--accent); }

.target-type {
  display: block;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.target-badges {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 500;
}

.badge-critical { background: rgba(239, 68, 68, 0.2); color: var(--red); }
.badge-high { background: rgba(249, 115, 22, 0.2); color: var(--orange); }
.badge-medium { background: rgba(234, 179, 8, 0.2); color: var(--yellow); }
.badge-low { background: rgba(34, 197, 94, 0.2); color: var(--green); }

.threat-indicator {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
}

.threat-CRITICAL { background: var(--red); color: white; }
.threat-HIGH { background: var(--orange); color: white; }
.threat-MEDIUM { background: var(--yellow); color: #000; }
.threat-LOW { background: var(--green); color: white; }

.detail-panel {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  gap: 16px;
}

.empty-state svg {
  width: 64px;
  height: 64px;
  opacity: 0.3;
}

.empty-state p {
  font-size: 14px;
}

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.detail-title {
  font-size: 20px;
  font-weight: 600;
}

.detail-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}

.detail-section h3 {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.detail-grid {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 6px 12px;
  font-size: 13px;
}

.detail-label {
  color: var(--text-dim);
}

.detail-value {
  font-weight: 500;
  word-break: break-all;
}

.vuln-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.vuln-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 4px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: var(--red);
}

.actions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}

.action-card {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
  background: var(--bg);
}

.action-card:hover {
  border-color: var(--accent);
  background: var(--accent-glow);
}

.action-card:disabled { opacity: 0.55; cursor: wait; }

.action-card.severity-danger { border-color: rgba(239, 68, 68, 0.3); }
.action-card.severity-danger:hover { border-color: var(--red); background: rgba(239, 68, 68, 0.05); }
.action-card.severity-warning { border-color: rgba(234, 179, 8, 0.3); }
.action-card.severity-warning:hover { border-color: var(--yellow); background: rgba(234, 179, 8, 0.05); }

.action-label {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.action-category {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.cat-simulated { background: rgba(168, 85, 247, 0.15); color: var(--purple); }
.cat-passive { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }
.cat-active { background: rgba(239, 68, 68, 0.15); color: var(--red); }

.action-desc {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
}

.action-result {
  margin-top: 16px;
  padding: 12px;
  border-radius: 6px;
  font-size: 12px;
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.2);
  color: var(--green);
  white-space: pre-wrap;
  word-break: break-all;
}

.action-result.error {
  background: rgba(239, 68, 68, 0.1);
  border-color: rgba(239, 68, 68, 0.2);
  color: var(--red);
}

.action-result .data-block {
  margin-top: 8px;
  padding: 8px;
  background: rgba(0,0,0,0.2);
  border-radius: 4px;
  font-size: 11px;
  color: var(--text-dim);
  max-height: 200px;
  overflow-y: auto;
}

.log-panel {
  margin-top: 16px;
}

.log-entry {
  display: flex;
  gap: 8px;
  font-size: 11px;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

.log-time { color: var(--text-dim); white-space: nowrap; }
.log-target { color: var(--cyan); }
.log-action { color: var(--yellow); }
.log-result { color: var(--green); }
.log-result.error { color: var(--red); }

.signal-bar {
  display: inline-flex;
  align-items: flex-end;
  gap: 1px;
  height: 12px;
}

.signal-bar span {
  width: 3px;
  background: var(--text-dim);
  border-radius: 1px;
}

.signal-bar.strong span { background: var(--green); }
.signal-bar.medium span:nth-child(-n+3) { background: var(--yellow); }
.signal-bar.weak span:nth-child(-n+2) { background: var(--red); }

.scan-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.scan-modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px;
  text-align: center;
  width: min(380px, calc(100vw - 32px));
  min-width: 0;
}

.scan-modal h2 { margin-bottom: 24px; font-size: 16px; }

.scanner-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}

.scanner-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-radius: 6px;
  background: var(--bg);
  font-size: 13px;
}

.scanner-item .scanner-label {
  display: flex;
  align-items: center;
  gap: 8px;
}

.scanner-item .hw-badge {
  font-size: 9px;
  padding: 1px 4px;
  border-radius: 2px;
  background: rgba(34, 197, 94, 0.15);
  color: var(--green);
}

.scanner-item .hw-badge.unavailable {
  background: rgba(239, 68, 68, 0.15);
  color: var(--red);
}

.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.score-bar {
  width: 50px;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
  margin-left: 6px;
}

.score-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}

.event-feed {
  position: fixed;
  bottom: 16px;
  right: 16px;
  width: 320px;
  max-height: 200px;
  overflow-y: auto;
  z-index: 50;
  display: flex;
  flex-direction: column-reverse;
  gap: 4px;
  pointer-events: none;
}

.event-toast {
  padding: 8px 12px;
  border-radius: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  animation: fadeIn 0.3s ease-out;
  pointer-events: auto;
}

.event-toast.target { border-color: var(--green); color: var(--green); }
.event-toast.error { border-color: var(--red); color: var(--red); }
.event-toast.action { border-color: var(--yellow); color: var(--yellow); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 768px) {
  .main { flex-direction: column; }
  .target-list { width: 100%; min-width: 0; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  .detail-panel { padding: 16px; }
  .actions-grid { grid-template-columns: 1fr; }
  .event-feed { width: 220px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>DRONE SCANNER</h1>
  <div class="header-status" role="status" aria-live="polite">
    <span id="scanner-wifi"><span class="status-dot idle"></span>WiFi</span>
    <span id="scanner-ble"><span class="status-dot idle"></span>BLE</span>
    <span id="scanner-sdr"><span class="status-dot idle"></span>SDR</span>
    <span id="scanner-mavlink"><span class="status-dot idle"></span>MAVLink</span>
    <span id="scanner-telemetry"><span class="status-dot idle"></span>Telemetry</span>
    <span id="target-count" style="margin-left:8px; color:var(--accent)">0 targets</span>
  </div>
</div>

<div class="toolbar">
  <button type="button" class="btn btn-primary" id="btn-scan">Scan</button>
  <button type="button" class="btn" id="btn-clear">Clear</button>
  <span style="flex:1"></span>
  <span id="mode-badge" style="font-size:11px; color:var(--text-dim)"></span>
</div>

<div class="main">
  <div class="target-list" id="target-list">
    <div class="target-list-header">
      <span id="target-list-title">Discovered Targets</span>
    </div>
    <div id="target-items">
      <div class="empty-state" style="padding:48px 16px">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>
        </svg>
        <p>No targets found. Click Scan to begin.</p>
      </div>
    </div>
  </div>

  <div class="detail-panel" id="detail-panel">
    <div class="empty-state" id="detail-empty">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 9h6M9 12h6M9 15h4"/>
      </svg>
      <p>Select a target to view details and actions</p>
    </div>
    <div id="detail-content" style="display:none"></div>
  </div>
</div>

<div class="scan-overlay" id="scan-overlay" style="display:none" role="status" aria-live="polite" aria-busy="true" aria-hidden="true">
  <div class="scan-modal">
    <h2>Scanning for drones...</h2>
    <div class="scanner-list" id="scanner-list-modal">
      <div class="scanner-item">
        <span class="scanner-label">WiFi Scanner</span>
        <span id="scan-wifi-status"><span class="spinner"></span></span>
      </div>
      <div class="scanner-item">
        <span class="scanner-label">BLE Scanner</span>
        <span id="scan-ble-status"><span class="spinner"></span></span>
      </div>
      <div class="scanner-item">
        <span class="scanner-label">SDR / RF Scanner</span>
        <span id="scan-sdr-status"><span class="spinner"></span></span>
      </div>
      <div class="scanner-item">
        <span class="scanner-label">MAVLink Sniffer</span>
        <span id="scan-mavlink-status"><span class="spinner"></span></span>
      </div>
      <div class="scanner-item">
        <span class="scanner-label">Passive Telemetry</span>
        <span id="scan-telemetry-status"><span class="spinner"></span></span>
      </div>
    </div>
    <div id="scan-found" style="font-size:13px;color:var(--text-dim)"></div>
  </div>
</div>

<div class="event-feed" id="event-feed" role="log" aria-live="polite" aria-relevant="additions"></div>

<script>
let targets = [];
let selectedTargetId = null;
let actionDefs = {};
let scanPollTimer = null;
let eventSource = null;
let statusRequestSequence = 0;
let renderedTargetSignature = null;
let sseDisconnected = false;

async function init() {
  document.getElementById('btn-scan').addEventListener('click', startScan);
  document.getElementById('btn-clear').addEventListener('click', clearTargets);

  connectSSE();
  try {
    actionDefs = await fetchJson('/api/actions');
  } catch (error) {
    showToast(`Unable to load actions: ${error.message}`, 'error');
  }
  await refreshStatus(true);
}

async function fetchJson(url, options = {}) {
  const response = await fetch(url, options);
  let data = null;
  try {
    data = await response.json();
  } catch (error) {
    if (response.ok) throw new Error('Server returned an invalid response');
  }
  if (!response.ok) {
    throw new Error(data?.error || `Request failed (${response.status})`);
  }
  return data;
}

function parseEventData(event) {
  try {
    return JSON.parse(event.data);
  } catch (error) {
    showToast('Received an invalid live update', 'error');
    return null;
  }
}

function connectSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/events');
  eventSource.onopen = () => { sseDisconnected = false; };

  eventSource.addEventListener('target_found', (e) => {
    const data = parseEventData(e);
    if (!data) return;
    showToast(`Target found: ${data.name} [${data.protocol}]`, 'target');
    refreshStatus();
  });

  eventSource.addEventListener('scanner_done', (e) => {
    const data = parseEventData(e);
    if (!data) return;
    refreshStatus();
  });

  eventSource.addEventListener('scanner_error', (e) => {
    const data = parseEventData(e);
    if (!data) return;
    showToast(`${data.scanner} scanner error: ${data.error}`, 'error');
    refreshStatus();
  });

  eventSource.addEventListener('scan_complete', (e) => {
    const data = parseEventData(e);
    if (!data) return;
    showToast(`Scan complete: ${data.target_count} target(s)`, 'target');
    refreshStatus();
  });

  eventSource.addEventListener('action_executed', (e) => {
    const data = parseEventData(e);
    if (!data) return;
    const cls = data.status === 'error' ? 'error' : 'action';
    showToast(`${data.label}: ${data.status}`, cls);
  });

  eventSource.onerror = () => {
    if (!sseDisconnected) {
      sseDisconnected = true;
      showToast('Live updates disconnected; reconnecting...', 'error');
    }
  };
}

function showToast(msg, cls) {
  const feed = document.getElementById('event-feed');
  const toast = document.createElement('div');
  toast.className = `event-toast ${cls || ''}`;
  toast.textContent = msg;
  feed.prepend(toast);
  // Keep only last 5 toasts
  while (feed.children.length > 5) feed.removeChild(feed.lastChild);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 6000);
}

async function refreshStatus(showErrors = false) {
  const requestSequence = ++statusRequestSequence;
  try {
    const data = await fetchJson('/api/status');
    if (requestSequence !== statusRequestSequence) return null;
    targets = Array.isArray(data.targets)
      ? data.targets.filter(target => target && typeof target === 'object') : [];

    const modeLabel = data.simulate ? 'SIMULATE MODE'
      : data.dry_run ? 'LIVE MODE (DRY-RUN)' : 'LIVE MODE';
    document.getElementById('mode-badge').textContent = modeLabel;

    updateScannerStatus(data.scanner_status || {});
    document.getElementById('target-count').textContent =
      `${data.target_count} target${data.target_count !== 1 ? 's' : ''}`;

    renderTargetList();

    const overlay = document.getElementById('scan-overlay');
    const scanButton = document.getElementById('btn-scan');
    const clearButton = document.getElementById('btn-clear');
    if (data.scanning) {
      overlay.style.display = 'flex';
      overlay.setAttribute('aria-hidden', 'false');
      scanButton.disabled = true;
      clearButton.disabled = true;
      document.getElementById('scan-found').textContent =
        `${data.target_count} target(s) found so far`;
      scheduleScanPoll();
    } else {
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden', 'true');
      scanButton.disabled = false;
      clearButton.disabled = false;
      stopScanPolling();
    }

    if (selectedTargetId) {
      const t = targets.find(t => t.id === selectedTargetId);
      if (t) {
        renderDetail(t);
      } else {
        resetDetail();
      }
    }
    return data;
  } catch (e) {
    console.error('Status fetch failed:', e);
    if (showErrors) showToast(`Unable to load status: ${e.message}`, 'error');
    return null;
  }
}

function stopScanPolling() {
  if (scanPollTimer) {
    clearTimeout(scanPollTimer);
    scanPollTimer = null;
  }
}

function scheduleScanPoll() {
  if (scanPollTimer) return;
  scanPollTimer = setTimeout(async () => {
    scanPollTimer = null;
    const data = await refreshStatus();
    if (data === null || data.scanning) scheduleScanPoll();
  }, 1000);
}

function updateScannerStatus(status) {
  for (const [name, state] of Object.entries(status)) {
    const el = document.getElementById(`scanner-${name}`);
    if (!el) continue;
    const safeState = ['idle', 'scanning', 'done', 'error'].includes(state) ? state : 'error';
    const dot = el.querySelector('.status-dot');
    if (dot) dot.className = 'status-dot ' + safeState;
    el.setAttribute('aria-label', `${name}: ${safeState}`);

    const modalEl = document.getElementById(`scan-${name}-status`);
    if (modalEl) {
      if (safeState === 'scanning') {
        modalEl.innerHTML = '<span class="spinner"></span>';
      } else if (safeState === 'done') {
        modalEl.innerHTML = '<span style="color:var(--green)">Done</span>';
      } else if (safeState === 'error') {
        modalEl.innerHTML = '<span style="color:var(--red)">Error</span>';
      } else {
        modalEl.innerHTML = '<span style="color:var(--text-dim)">Idle</span>';
      }
    }
  }
}

async function startScan() {
  const overlay = document.getElementById('scan-overlay');
  const scanButton = document.getElementById('btn-scan');
  if (scanButton.disabled) return;
  stopScanPolling();
  overlay.style.display = 'flex';
  overlay.setAttribute('aria-hidden', 'false');
  scanButton.disabled = true;
  ['wifi','ble','sdr','mavlink','telemetry'].forEach(n => {
    const el = document.getElementById(`scan-${n}-status`);
    if (el) el.innerHTML = '<span class="spinner"></span>';
  });
  document.getElementById('scan-found').textContent = '';

  try {
    await fetchJson('/api/scan', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: '{}',
    });
    const data = await refreshStatus(true);
    if (data === null || data.scanning) scheduleScanPoll();
  } catch (error) {
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden', 'true');
    scanButton.disabled = false;
    showToast(`Unable to start scan: ${error.message}`, 'error');
  }
}

async function clearTargets() {
  try {
    await fetchJson('/api/clear', { method: 'POST' });
    targets = [];
    resetDetail();
    renderTargetList();
    document.getElementById('target-count').textContent = '0 targets';
  } catch (error) {
    showToast(`Unable to clear targets: ${error.message}`, 'error');
  }
}

function renderTargetList() {
  const container = document.getElementById('target-items');
  if (targets.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding:48px 16px">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:64px;height:64px;opacity:0.3">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>
        </svg>
        <p>No targets found. Click Scan to begin.</p>
      </div>`;
    return;
  }

  container.innerHTML = targets.map(t => {
    const protocol = String(t?.protocol || 'unknown');
    const targetId = String(t?.id || '');
    const protoClass = 'proto-' + safeCssClass(protocol.replace(/_.*/, ''));
    const selected = t.id === selectedTargetId ? 'selected' : '';
    const signal = renderSignal(t.signal);
    const threatLevel = String(t.threat_level || 'LOW');
    const threatClass = safeCssClass(threatLevel);
    const vulnBadges = (Array.isArray(t.vulns) ? t.vulns : []).slice(0, 3).map(v =>
      `<span class="badge badge-${threatClass}">${escHtml(v)}</span>`
    ).join('');

    return `
      <button type="button" class="target-item ${selected}" data-target-id="${escAttr(targetId)}" aria-pressed="${selected ? 'true' : 'false'}">
        <span class="target-item-top">
          <span class="target-name">${escHtml(t.name || 'Unnamed target')}</span>
          <span>
            <span class="target-protocol ${protoClass}">${escHtml(protocol)}</span>
            <span class="threat-indicator threat-${threatClass}">${escHtml(threatLevel)}</span>
          </span>
        </span>
        <span class="target-type">${escHtml(t.type || 'Unknown')} ${signal}</span>
        <span class="target-badges">${vulnBadges}</span>
      </button>`;
  }).join('');

  container.querySelectorAll('.target-item[data-target-id]').forEach(el => {
    el.addEventListener('click', () => selectTarget(el.dataset.targetId));
  });
}

function renderSignal(dbm) {
  if (dbm == null || dbm === '') return '';
  const value = Number(dbm);
  if (!Number.isFinite(value)) return '';
  const abs = Math.abs(value);
  let cls = 'strong';
  if (abs > 70) cls = 'weak';
  else if (abs > 55) cls = 'medium';
  const bars = [4, 6, 8, 10].map(h =>
    `<span style="height:${h}px"></span>`
  ).join('');
  return `<span class="signal-bar ${cls}" aria-hidden="true">${bars}</span> ${escHtml(value)} dBm`;
}

function selectTarget(id) {
  selectedTargetId = id;
  renderedTargetSignature = null;
  const t = targets.find(t => t.id === id);
  if (t) {
    renderDetail(t);
    renderTargetList();
  }
}

function resetDetail() {
  selectedTargetId = null;
  renderedTargetSignature = null;
  document.getElementById('detail-content').style.display = 'none';
  document.getElementById('detail-empty').style.display = 'flex';
}

function renderDetail(t) {
  const signature = JSON.stringify(t);
  if (signature === renderedTargetSignature) return;
  renderedTargetSignature = signature;
  document.getElementById('detail-empty').style.display = 'none';
  const el = document.getElementById('detail-content');
  el.style.display = 'block';

  const details = t.details && typeof t.details === 'object' && !Array.isArray(t.details)
    ? t.details : {};
  const detailRows = Object.entries(details).map(([k, v]) => {
    let val = v;
    if (typeof v === 'object') val = JSON.stringify(v);
    if (typeof v === 'boolean') val = v ? 'Yes' : 'No';
    return `<span class="detail-label">${escHtml(k)}</span><span class="detail-value">${escHtml(String(val))}</span>`;
  }).join('');

  const vulns = (Array.isArray(t.vulns) ? t.vulns : []).map(v =>
    `<div class="vuln-tag">${escHtml(v)}</div>`
  ).join('');

  const categoryLabels = {simulated: 'Simulated', passive: 'Passive', active: 'Active'};
  const actions = (Array.isArray(t.available_actions) ? t.available_actions : []).map(a => {
    const def = actionDefs[a] || {};
    const sev = safeCssClass(def.severity || 'info');
    const cat = safeCssClass(def.category || 'active');
    const catLabel = categoryLabels[def.category] || 'Active';
    return `
      <button type="button" class="action-card severity-${sev}" data-action-target="${escAttr(t.id)}" data-action-name="${escAttr(a)}">
        <span class="action-label">${escHtml(def.label || a)} <span class="action-category cat-${cat}">${escHtml(catLabel)}</span></span>
        <span class="action-desc">${escHtml(def.description || '')}</span>
      </button>`;
  }).join('');

  const rawScore = Number(t.score);
  const score = Number.isFinite(rawScore) ? Math.min(100, Math.max(0, rawScore)) : 0;
  const scoreColor = score >= 80 ? 'var(--red)' : score >= 60 ? 'var(--orange)' : score >= 40 ? 'var(--yellow)' : 'var(--green)';
  const signal = t.signal == null || t.signal === '' ? NaN : Number(t.signal);

  el.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-title">${escHtml(t.name || 'Unnamed target')}</div>
        <div style="font-size:13px;color:var(--text-dim);margin-top:4px">${escHtml(t.type || 'Unknown')}</div>
      </div>
      <div style="text-align:right">
        <span class="threat-indicator threat-${safeCssClass(t.threat_level || 'LOW')}" style="font-size:13px;padding:4px 10px">${escHtml(t.threat_level || 'LOW')}</span>
        <div style="font-size:11px;color:var(--text-dim);margin-top:6px">
          Score: ${score}/100
          <span class="score-bar"><span class="score-fill" style="width:${score}%;background:${scoreColor}"></span></span>
        </div>
      </div>
    </div>

    <div class="detail-section">
      <h3>Properties</h3>
      <div class="detail-grid">
        <span class="detail-label">Protocol</span><span class="detail-value">${escHtml(t.protocol)}</span>
        <span class="detail-label">Encryption</span><span class="detail-value">${escHtml(t.encryption || 'Unknown')}</span>
        ${Number.isFinite(signal) ? `<span class="detail-label">Signal</span><span class="detail-value">${escHtml(signal)} dBm</span>` : ''}
        ${detailRows}
      </div>
    </div>

    ${vulns ? `
    <div class="detail-section">
      <h3>Vulnerabilities</h3>
      <div class="vuln-list">${vulns}</div>
    </div>` : ''}

    <div class="detail-section">
      <h3>Available Actions</h3>
      ${actions ? `<div class="actions-grid">${actions}</div>` : '<div style="color:var(--text-dim);font-size:13px">No actions available</div>'}
      <div id="action-result"></div>
    </div>

    <div class="detail-section log-panel">
      <h3>Action Log</h3>
      <div id="action-log-entries"></div>
    </div>`;

  el.querySelectorAll('.action-card[data-action-name]').forEach(card => {
    card.addEventListener('click', () => {
      executeAction(card.dataset.actionTarget, card.dataset.actionName, card);
    });
  });

  refreshActionLog(t.id);
}

async function executeAction(targetId, actionName, actionButton) {
  const resultEl = document.getElementById('action-result');
  if (!resultEl || actionButton?.disabled) return;
  if (actionButton) actionButton.disabled = true;
  resultEl.innerHTML = '<div style="color:var(--text-dim);font-size:12px;padding:8px">Executing...</div>';

  try {
    const data = await fetchJson(`/api/targets/${encodeURIComponent(targetId)}/action`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ action: actionName }),
    });
    if (selectedTargetId === targetId && resultEl.isConnected) {
      const dataBlock = data.data
        ? `<div class="data-block"><pre>${escHtml(JSON.stringify(data.data, null, 2))}</pre></div>`
        : '';
      const cls = data.status === 'error' ? 'error' : '';
      resultEl.innerHTML = `
        <div class="action-result ${cls}">
          <strong>${escHtml(data.label || actionName)}</strong> [${escHtml(data.status)}]
          <br>${escHtml(data.result)}
          ${dataBlock}
        </div>`;
    }
  } catch(error) {
    if (selectedTargetId === targetId && resultEl.isConnected) {
      resultEl.innerHTML = `<div class="action-result error">Error: ${escHtml(error.message)}</div>`;
    }
  } finally {
    if (actionButton?.isConnected) actionButton.disabled = false;
  }

  if (selectedTargetId === targetId) refreshActionLog(targetId);
}

async function refreshActionLog(targetId) {
  try {
    const log = await fetchJson('/api/log');
    if (selectedTargetId !== targetId || !Array.isArray(log)) return;
    const entries = log.filter(e => e.target_id === targetId).reverse().slice(0, 10);
    const el = document.getElementById('action-log-entries');
    if (!el) return;
    if (entries.length === 0) {
      el.innerHTML = '<div style="color:var(--text-dim);font-size:12px">No actions performed yet</div>';
      return;
    }
    el.innerHTML = entries.map(e => {
      const time = new Date(e.timestamp).toLocaleTimeString();
      const resultCls = e.status === 'error' ? 'error' : '';
      return `
        <div class="log-entry">
          <span class="log-time">${time}</span>
          <span class="log-action">${escHtml(e.label || e.action)}</span>
          <span class="log-result ${resultCls}">[${escHtml(e.status)}]</span>
        </div>`;
    }).join('');
  } catch(e) {}
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[char]);
}

function escAttr(s) {
  return escHtml(s);
}

function safeCssClass(s) {
  return String(s || '').replace(/[^a-zA-Z0-9_-]/g, '');
}

init();
</script>
</body>
</html>
