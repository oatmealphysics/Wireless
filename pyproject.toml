# Unified pyproject — merged from elrs-sdr-transfer + poc-research (2026-10-16).
# Two workstreams now live in one repo:
#   - elrs_sdr/        (the ELRS SDR detector package, the `elrs-sdr` command)
#   - tools/ + web/    (CTF exploit tooling, ruff-checked)
# The top-level [project] is the ELRS package (setuptools); the CTF side is
# scripts, not a separate installable package, so it has no build entry here —
# it is configured for the linter below instead.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elrs-sdr"
version = "0.1.0"
description = "ELRS drone-signal detector + wireless CTF exploit tooling (merged repo)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# UHD is installed system-wide (C++ lib + python bindings), not via pip.
# On the host with the radio, ensure `import uhd` works:
#   sudo apt install uhd-host python3-uhd   (or build UHD with python bindings)
radio = []

[project.scripts]
elrs-sdr = "elrs_sdr.cli:main"

[tool.setuptools]
packages = ["elrs_sdr", "elrs_sdr.core"]

# ---------------------------------------------------------------------------
# Linter — CTF tooling (tools/ + web/). elrs_sdr/ keeps its own test/selftest
# conventions (see AGENTS.md); ruff here is scoped to the PoC side.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["tools", "web"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "E402",   # module-import-not-at-top — tests use sys.path before imports
    "E731",   # lambda assignment — used for concise test factories
    "E741",   # ambiguous variable name — l/O are context-appropriate in RF math
    "SIM102", # collapsible-if — readability preference
    "SIM103", # needless-bool — readability preference
    "SIM105", # suppressible-exception — try/except/pass is clearer than contextlib
    "SIM108", # ternary operator — readability preference
    "SIM113", # enumerate-for-loop — not always clearer
    "SIM115", # open-file-with-context-handler — scripts close on exit
    "SIM117", # multiple-with-statements — readability preference
    "UP015",  # redundant open mode — explicit is fine
    "UP038",  # isinstance union — deprecated in ruff >=0.3; isinstance(x,(A,B)) is fine
    "B904",   # raise from in except — not always appropriate
    "B905",   # zip-without-explicit-strict — Python 3.10 compat patterns
    "RUF002", # ambiguous unicode in docstrings — intentional symbols (us, dBm)
    "RUF003", # ambiguous unicode in comments — same
]
