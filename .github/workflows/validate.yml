name: Offline project validation
on:
  # Temporarily disabled push/pull_request triggers — Actions minutes
  # exhausted for the month. Re-enable after Nov 1 reset.
  # push:
  # pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tools/validate-project.py
      - run: python -B -m unittest discover -s tools/tests -p "test_*.py"

  protocol-tests:
    name: Protocol conformance (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: ELRS core (CRC, OTA, FHSS) conformance
        run: python -B -m unittest tools.tests.test_elrs_core_validation -v
      - name: ELRS v3 frame wire format
        run: python -B -m unittest tools.tests.test_elrs_v3_frame_check -v
      - name: ELRS v3 FHSS sequence
        run: python -B -m unittest tools.tests.test_elrs_v3_fhss_check -v
      - name: Capture forge validation pipeline
        run: python -B -m unittest tools.tests.test_capture_forge_validate -v
      - name: Rainbow table schema and loader patterns
        run: python -B -m unittest tools.tests.test_rainbow_table_schema -v

  lint:
    name: Ruff lint check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ruff==0.11.12
      - run: python -m ruff check tools/ web/

  web-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r web/requirements-e2e.txt
      - run: python -B -m unittest discover -s tools/tests -p "test_web_dashboard.py" -v
      - run: python -B -m unittest discover -s web/tests -p "test_api_routes.py" -v
      - run: python -B -m unittest discover -s web/tests -p "test_app_factory.py" -v
      - run: python -B -m unittest discover -s web/tests -p "test_app_lifecycle.py" -v
      - run: python -B -m unittest discover -s web/tests -p "test_state_histories.py" -v
      - run: python -B -m unittest discover -s web/tests -p "test_dashboard_browser.py" -v
        env:
          DASHBOARD_BROWSER_CHANNEL: chrome

  lint:
    name: Ruff lint (maintained modules)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ruff==0.8.6
      - run: python -m ruff check web/app.py tools/exploit_chains/common.py web/tests/

  typecheck:
    name: Mypy (maintained modules)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check mypy==1.14.1
      - run: python -m mypy --ignore-missing-imports --follow-imports=skip --no-error-summary tools/exploit_chains/common.py
